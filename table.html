<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tabelle · Naming Poetics of Middle High German Epic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    /* ─── Variables ─────────────────── */
    :root {
      --ink:        #1a1410;
      --ink-mid:    #3a2e26;
      --ink-soft:   #6b5c4e;
      --ink-faint:  #a89880;
      --parchment:  #f7f2eb;
      --warm-white: #fdfaf5;
      --gold:       #8C6A4A;   /* Naming-Braun     */
      --gold-light: #EFE4D4;   /* Proper-name-Beige */
      --navy:       #2F4A6D;   /* Epithets-Blau    */
      --navy-light: #6A97B8;
      --auxiliary:  #A3A39A;   /* AUXILIARY gray   */
      --light-text: #F4F6F6;   /* LIGHT_TEXT       */
      --rule:       rgba(140, 106, 74, 0.25);

      --font-display: 'Cormorant Garamond', Georgia, serif;
      --font-body:    'EB Garamond', Georgia, serif;
      --font-meta:    'Crimson Pro', Georgia, serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; }

    body {
      background-color: var(--warm-white);
      color: var(--ink);
      font-family: var(--font-body);
      font-size: 18px;
      line-height: 1.7;
      min-height: 100vh;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    .page {
      position: relative;
      z-index: 1;
      max-width: 980px;
      margin: 0 auto;
      padding: 64px 40px 120px;
    }

    /* ─── Back link ─────────────────────────────────────────────── */
    .back {
      display: inline-block;
      font-family: var(--font-meta);
      font-size: 14px;
      font-weight: 300;
      letter-spacing: 0.06em;
      color: var(--ink-faint);
      text-decoration: none;
      margin-bottom: 36px;
      transition: color 0.25s;
    }
    .back:hover { color: var(--gold); }

    /* ─── Header ────────────────────────────────────────────────── */
    header {
      border-bottom: 1px solid var(--rule);
      padding-bottom: 36px;
      margin-bottom: 36px;
      animation: fadeUp 0.6s ease both;
    }
    .header-eyebrow {
      font-family: var(--font-meta);
      font-size: 12px;
      font-weight: 300;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-faint);
      margin-bottom: 16px;
    }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 4vw, 2.6rem);
      font-weight: 300;
      line-height: 1.2;
      color: var(--ink);
      letter-spacing: -0.01em;
    }
    h1 em { font-style: italic; color: var(--gold); }
    .header-subtitle {
      font-family: var(--font-meta);
      font-size: 16px;
      font-weight: 300;
      color: var(--ink-soft);
      font-style: italic;
      margin-top: 12px;
      max-width: 620px;
    }

    /* ─── Controls ──────────────────────────────────────────────── */
    .controls {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 18px;
      animation: fadeUp 0.6s ease 0.1s both;
    }
    .search {
      font-family: var(--font-body);
      font-size: 16px;
      color: var(--ink);
      background: var(--parchment);
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 8px 14px;
      width: 280px;
      max-width: 100%;
      transition: border-color 0.25s, background 0.25s;
    }
    .search:focus {
      outline: none;
      border-color: rgba(140, 106, 74, 0.55);
      background: #f9f4ec;
    }
    .search::placeholder { color: var(--ink-faint); font-style: italic; }

    .caption {
      font-family: var(--font-meta);
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--auxiliary);
    }

    /* ─── Table (Stil "Diss") ───────────────────────────────────── */
    .table-wrap {
      overflow-x: auto;
      animation: fadeUp 0.6s ease 0.15s both;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 16px;
      background: var(--warm-white);
    }
    thead th {
      background: var(--navy);              /* Header in Epithets-Blau */
      color: var(--light-text);
      font-family: var(--font-meta);
      font-weight: 400;
      font-size: 13px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: left;
      padding: 12px 16px;
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
      position: relative;
      transition: background 0.2s;
    }
    thead th:hover { background: #36567f; }
    thead th .arrow {
      font-size: 10px;
      margin-left: 6px;
      opacity: 0.55;
    }
    thead th.numeric { text-align: right; }

    tbody td {
      padding: 11px 16px;
      border: none;                          /* randlos */
      color: var(--ink-mid);
      vertical-align: top;
    }
    tbody td.numeric {
      text-align: right;
      font-variant-numeric: tabular-nums;
    }
    tbody tr:nth-child(odd)  td { background: var(--warm-white); }  /* weiß  */
    tbody tr:nth-child(even) td { background: var(--gold-light); }  /* Beige */
    tbody tr:hover td { background: #f3e7d4; }

    /* ─── JSON view: hierarchical lemma tables ──────────────────── */
    .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 2px;
      margin-bottom: 22px;
      border-bottom: 1px solid var(--rule);
      animation: fadeUp 0.6s ease 0.12s both;
    }
    .tab {
      font-family: var(--font-meta);
      font-size: 15px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      padding: 9px 18px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab:hover { color: var(--gold); }
    .tab.active { color: var(--ink); border-bottom-color: var(--gold); }
    .tab em { font-style: italic; }

    .hint {
      font-family: var(--font-meta);
      font-size: 15px;
      font-weight: 300;
      font-style: italic;
      color: var(--ink-soft);
      margin-bottom: 14px;
    }
    .bulk-wrap { display: flex; gap: 8px; }
    .bulk {
      font-family: var(--font-meta);
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      background: var(--parchment);
      border: 1px solid var(--rule);
      border-radius: 2px;
      padding: 6px 14px;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s, background 0.2s;
    }
    .bulk:hover {
      color: var(--gold);
      border-color: rgba(140, 106, 74, 0.55);
      background: #f9f4ec;
    }

    tr.figure-row { cursor: pointer; }
    tr.figure-row td { background: var(--warm-white); }
    tr.figure-row.alt td { background: var(--gold-light); }
    tr.figure-row:hover td { background: #f3e7d4; }
    tr.figure-row.open td { background: #f3e7d4; }
    td.twisty {
      width: 1.4em;
      padding-right: 0;
      color: var(--gold);
      font-size: 11px;
      user-select: none;
    }
    td.figure-name { font-weight: 500; }

    tr.detail-row > td {
      background: var(--parchment);
      padding: 4px 16px 18px 46px;
    }
    table.detail {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
      background: none;
    }
    table.detail th {
      font-family: var(--font-meta);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-align: left;
      color: var(--ink-faint);
      background: none;
      padding: 8px 12px 6px;
      border-bottom: 1px solid var(--rule);
      cursor: default;
      white-space: nowrap;
    }
    table.detail td {
      padding: 7px 12px;
      color: var(--ink-mid);
      background: none;
      vertical-align: top;
    }
    table.detail td.numeric { text-align: right; font-variant-numeric: tabular-nums; }
    table.detail tr + tr td { border-top: 1px solid rgba(140, 106, 74, 0.12); }
    table.detail td.naming { font-style: italic; }

    .badge {
      display: inline-block;
      font-family: var(--font-meta);
      font-size: 11px;
      font-weight: 400;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 2px 9px;
      border-radius: 2px;
      color: var(--light-text);
      white-space: nowrap;
    }
    .badge-narrator     { background: var(--navy); }
    .badge-speech       { background: var(--gold); }
    .badge-self         { background: var(--auxiliary); }
    .badge-unattributed { background: var(--ink-faint); }

    .summary {
      font-family: var(--font-meta);
      font-size: 15px;
      font-weight: 300;
      color: var(--ink-soft);
      margin-bottom: 18px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--rule);
    }
    .summary strong {
      font-family: var(--font-body);
      font-weight: 500;
      font-style: italic;
      color: var(--gold);
    }

    /* ─── States ────────────────────────────────────────────────── */
    .state {
      font-family: var(--font-meta);
      font-size: 16px;
      font-weight: 300;
      color: var(--ink-soft);
      font-style: italic;
      padding: 40px 0;
    }
    .state.error {
      color: var(--gold);
      font-style: normal;
      background: var(--parchment);
      border: 1px solid var(--rule);
      border-left: 3px solid var(--gold);
      border-radius: 2px;
      padding: 24px 28px;
    }
    .state.error code {
      font-family: ui-monospace, Menlo, Consolas, monospace;
      font-size: 13px;
      background: rgba(140,106,74,0.10);
      padding: 1px 5px;
      border-radius: 2px;
    }

    /* ─── Footer ────────────────────────────────────────────────── */
    footer {
      border-top: 1px solid var(--rule);
      padding-top: 24px;
      margin-top: 48px;
      font-family: var(--font-meta);
      font-size: 13px;
      font-weight: 300;
      color: var(--ink-faint);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    footer a { color: var(--ink-faint); text-decoration: none; transition: color 0.25s; }
    footer a:hover { color: var(--gold); }
    footer em { font-style: italic; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .page { padding: 40px 20px 80px; }
      .search { width: 100%; }
      table { font-size: 15px; }
      tbody td, thead th { padding: 9px 12px; }
    }
  </style>
</head>
<body>
<div class="page">

  <a class="back" href="index.html">← Zurück zur Übersicht</a>

  <header>
    <p class="header-eyebrow" id="eyebrow">Tabelle</p>
    <h1 id="title">Tabelle</h1>
    <p class="header-subtitle" id="subtitle"></p>
  </header>

  <div class="controls">
    <input type="text" class="search" id="search" placeholder="Filter …" aria-label="Filter table" />
    <span class="bulk-wrap" id="bulk-wrap" hidden>
      <button type="button" class="bulk" id="expand-all">Expand all</button>
      <button type="button" class="bulk" id="collapse-all">Collapse all</button>
    </span>
    <span class="caption" id="caption"></span>
  </div>

  <div class="tabs" id="tabs" hidden></div>
  <p class="summary" id="summary" hidden></p>
  <p class="hint" id="hint" hidden></p>

  <div class="table-wrap">
    <div class="state" id="state">Lade Daten …</div>
    <table id="table" hidden>
      <thead><tr id="thead-row"></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <footer>
    <span>Linda Beutel-Thurow · <em>Naming Poetics of Middle High German Epic</em></span>
    <a id="download" href="#" download>CSV herunterladen</a>
  </footer>

</div>

<script>
(function () {
  'use strict';

  // ─── Query-Parameter lesen ──────────────────────────────────────
  // CSV :  table.html?csv=<pfad>&title=<titel>&desc=<beschreibung>&eyebrow=<label>
  // JSON:  table.html?json=<pfad>[&title=…&desc=…&eyebrow=…]
  //        erwartet die Ausgabe der Lemma-Suche: {book, scope, lemmas:[…]}
  //        Titel und Untertitel werden dort aus den Daten gebaut, wenn sie
  //        nicht als Parameter mitgegeben sind.
  const params   = new URLSearchParams(window.location.search);
  const jsonPath = params.get('json');
  const csvPath  = params.get('csv') || (jsonPath ? '' : 'beispiel_tabelle.csv');
  const title    = params.get('title')   || (jsonPath ? '' : 'CSV-Tabelle');
  const desc     = params.get('desc')    || '';
  const eyebrow  = params.get('eyebrow') || (jsonPath ? 'Lemma search' : 'Tabelle');

  document.getElementById('eyebrow').textContent = eyebrow;
  const titleEl = document.getElementById('title');
  const sub = document.getElementById('subtitle');
  if (title) {
    document.title = title + ' · Naming Poetics of Middle High German Epic';
    titleEl.innerHTML = title;                                 // erlaubt <em> im Titel
  }
  if (desc) { sub.textContent = desc; }

  const downloadEl = document.getElementById('download');
  downloadEl.href = jsonPath || csvPath;
  if (jsonPath) { downloadEl.textContent = 'Download JSON'; }

  let searchHandler = render;      // wird in der JSON-Ansicht umgehaengt

  const stateEl  = document.getElementById('state');
  const tableEl  = document.getElementById('table');
  const theadRow = document.getElementById('thead-row');
  const tbody    = document.getElementById('tbody');
  const search   = document.getElementById('search');
  const caption  = document.getElementById('caption');

  let fields = [];
  let rows   = [];
  let numericCols = {};          // feldname -> true/false
  let sortCol = null;
  let sortDir = 1;               // 1 = aufsteigend, -1 = absteigend

  // ─── Numerik-Erkennung (inkl. deutscher Dezimalkomma & %) ───────
  function parseNumber(v) {
    if (v === null || v === undefined) return NaN;
    let s = String(v).trim();
    if (s === '') return NaN;
    s = s.replace(/%/g, '').replace(/\s/g, '');
    // deutsches Format 1.234,5 -> 1234.5 ; sonst Punkt als Dezimaltrenner
    if (/,\d+$/.test(s) && /\./.test(s)) s = s.replace(/\./g, '').replace(',', '.');
    else if (/,/.test(s) && !/\./.test(s)) s = s.replace(',', '.');
    const n = Number(s);
    return isFinite(n) ? n : NaN;
  }
  function columnIsNumeric(field) {
    let seen = 0;
    for (const r of rows) {
      const v = r[field];
      if (v === null || v === undefined || String(v).trim() === '') continue;
      seen++;
      if (isNaN(parseNumber(v))) return false;
    }
    return seen > 0;
  }

  // ─── Rendern ────────────────────────────────────────────────────
  function buildHead() {
    theadRow.innerHTML = '';
    fields.forEach(function (f) {
      const th = document.createElement('th');
      th.textContent = f;
      if (numericCols[f]) th.classList.add('numeric');
      const arrow = document.createElement('span');
      arrow.className = 'arrow';
      th.appendChild(arrow);
      th.addEventListener('click', function () {
        if (sortCol === f) { sortDir = -sortDir; }
        else { sortCol = f; sortDir = 1; }
        render();
      });
      theadRow.appendChild(th);
    });
  }

  function sortedFilteredRows() {
    const q = search.value.trim().toLowerCase();
    let out = rows;
    if (q) {
      out = rows.filter(function (r) {
        return fields.some(function (f) {
          return String(r[f] ?? '').toLowerCase().includes(q);
        });
      });
    }
    if (sortCol !== null) {
      const num = numericCols[sortCol];
      out = out.slice().sort(function (a, b) {
        const av = a[sortCol], bv = b[sortCol];
        if (num) {
          const an = parseNumber(av), bn = parseNumber(bv);
          const aN = isNaN(an), bN = isNaN(bn);
          if (aN && bN) return 0;
          if (aN) return 1;          // Leeres ans Ende
          if (bN) return -1;
          return (an - bn) * sortDir;
        }
        return String(av ?? '').localeCompare(String(bv ?? ''), 'de') * sortDir;
      });
    }
    return out;
  }

  function render() {
    // Sortpfeile
    theadRow.querySelectorAll('th').forEach(function (th, i) {
      const a = th.querySelector('.arrow');
      a.textContent = (fields[i] === sortCol) ? (sortDir === 1 ? '▲' : '▼') : '';
    });

    const data = sortedFilteredRows();
    tbody.innerHTML = '';
    const frag = document.createDocumentFragment();
    data.forEach(function (r) {
      const tr = document.createElement('tr');
      fields.forEach(function (f) {
        const td = document.createElement('td');
        td.textContent = (r[f] ?? '');
        if (numericCols[f]) td.classList.add('numeric');
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });
    tbody.appendChild(frag);

    const total = rows.length;
    const shown = data.length;
    caption.textContent = (shown === total)
      ? (total + (total === 1 ? ' Zeile' : ' Zeilen'))
      : (shown + ' von ' + total + ' Zeilen');
  }

  // ─── CSV laden ──────────────────────────────────────────────────
  function loadCsv(csvPath) {
  if (!desc) { sub.remove(); }
  Papa.parse(csvPath, {
    download: true,
    header: true,
    skipEmptyLines: 'greedy',
    // Delimiter wird automatisch erkannt ( , ; \t )
    complete: function (results) {
      if (!results.data || !results.data.length || !results.meta.fields) {
        stateEl.innerHTML = 'Keine Daten gefunden in <code>' + csvPath + '</code>.';
        stateEl.classList.add('error');
        return;
      }
      fields = results.meta.fields.filter(function (f) { return f !== null && f !== ''; });
      rows   = results.data;
      fields.forEach(function (f) { numericCols[f] = columnIsNumeric(f); });

      buildHead();
      stateEl.hidden = true;
      tableEl.hidden = false;
      render();
    },
    error: function (err) {
      stateEl.classList.add('error');
      stateEl.innerHTML =
        'The file <code>' + csvPath + '</code> could not be loaded.<br><br>' +
        'Most common reason: The page was opened directly via <code>file://</code>. ' +
        'For security reasons, CSV files can only be loaded if the page is served via a ' +
        'server (e.g., locally <code>python3 -m http.server</code>, ' +
        'or via your hosting).<br><br><em>' + (err && err.message ? err.message : '') + '</em>';
    }
  });
  }

  // ═══════════════════════════════════════════════════════════════
  //  JSON view — hierarchical tables from the lemma search
  //
  //  Expects {book, scope, lemmas:[{lemma, total_mentions, figure_count,
  //  figures:[{figure, mentions, by_narrator, …, occurrences:[…]}]}]}.
  //  A figure row can be unfolded to show its individual mentions, so the
  //  evidence behind every number stays one click away.
  // ═══════════════════════════════════════════════════════════════
  const SCOPE_LABELS = {
    naming_variants: 'naming variants',
    epithets:        'epithets',
    both:            'naming variants and epithets'
  };
  const ATTRIBUTION = {
    narrator:      { label: 'Narrator',      cls: 'badge-narrator' },
    figure_speech: { label: 'Figure speech', cls: 'badge-speech' },
    self_naming:   { label: 'Self-naming',   cls: 'badge-self' },
    unattributed:  { label: 'Unattributed',  cls: 'badge-unattributed' }
  };
  const CATEGORY = {
    naming_variant: 'Naming variant',
    epithet:        'Epithet',
    both:           'Both'
  };

  const tabsEl    = document.getElementById('tabs');
  const hintEl    = document.getElementById('hint');
  const summaryEl = document.getElementById('summary');
  const bulkEl    = document.getElementById('bulk-wrap');

  let payload       = null;
  let hasComparison = false;   // only from two lemmas onwards
  let activeTab     = 0;       // 0 = comparison when present, else the lemma
  let expanded      = new Set();
  let jsonSortKey   = 'mentions';
  let jsonSortDir   = -1;      // -1 = descending

  function figureColumns(scope) {
    const cols = [
      { key: 'figure',           label: 'Named figure',  numeric: false },
      { key: 'mentions',         label: 'Mentions',      numeric: true  },
      { key: 'by_narrator',      label: 'Narrator',      numeric: true  },
      { key: 'in_figure_speech', label: 'Figure speech', numeric: true  },
      { key: 'self_naming',      label: 'Self-naming',   numeric: true  }
    ];
    if (scope === 'both') {
      cols.push({ key: 'as_naming_variant', label: 'As naming variant', numeric: true });
      cols.push({ key: 'as_epithet',        label: 'As epithet',        numeric: true });
    }
    cols.push({ key: 'share_percent', label: 'Share (%)', numeric: true });
    return cols;
  }

  function comparisonColumns() {
    const cols = [{ key: 'figure', label: 'Named figure', numeric: false }];
    payload.lemmas.forEach(function (lemma, i) {
      cols.push({ key: 'l' + i, label: lemma.lemma, numeric: true });
    });
    cols.push({ key: 'total', label: 'Total', numeric: true });
    return cols;
  }

  function currentLemma() {
    return payload.lemmas[hasComparison ? activeTab - 1 : activeTab];
  }

  function inComparison() {
    return hasComparison && activeTab === 0;
  }

  // ─── Head with sort arrows ──────────────────────────────────────
  function buildJsonHead(cols, leadingTwisty) {
    theadRow.innerHTML = '';

    if (leadingTwisty) {
      const th = document.createElement('th');
      th.style.cursor = 'default';
      th.innerHTML = '&nbsp;';
      theadRow.appendChild(th);
    }

    cols.forEach(function (col) {
      const th = document.createElement('th');
      th.textContent = col.label;
      if (col.numeric) th.classList.add('numeric');

      const arrow = document.createElement('span');
      arrow.className = 'arrow';
      arrow.textContent = (jsonSortKey === col.key) ? (jsonSortDir === 1 ? '▲' : '▼') : '';
      th.appendChild(arrow);

      th.addEventListener('click', function () {
        if (jsonSortKey === col.key) { jsonSortDir = -jsonSortDir; }
        else { jsonSortKey = col.key; jsonSortDir = col.numeric ? -1 : 1; }
        renderJson();
      });

      theadRow.appendChild(th);
    });
  }

  function sortJsonRows(data, cols) {
    const col = cols.filter(function (c) { return c.key === jsonSortKey; })[0];
    if (!col) return data;

    return data.slice().sort(function (a, b) {
      if (col.numeric) {
        return ((Number(a[col.key]) || 0) - (Number(b[col.key]) || 0)) * jsonSortDir;
      }
      return String(a[col.key] || '').localeCompare(String(b[col.key] || ''), 'de') * jsonSortDir;
    });
  }

  function filterByFigure(data) {
    const q = search.value.trim().toLowerCase();
    if (!q) return data;
    return data.filter(function (row) {
      return String(row.figure || '').toLowerCase().includes(q);
    });
  }

  // ─── Detail table: the individual mentions of one figure ────────
  function buildDetailTable(figure, scope) {
    const table = document.createElement('table');
    table.className = 'detail';

    const headers = ['Verse', 'Attribution', 'Namer', 'Naming'];
    if (scope === 'both') headers.push('Category');

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    headers.forEach(function (label, i) {
      const th = document.createElement('th');
      th.textContent = label;
      if (i === 0) th.classList.add('numeric');
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tb = document.createElement('tbody');
    (figure.occurrences || []).forEach(function (occ) {
      const tr = document.createElement('tr');

      const verse = document.createElement('td');
      verse.className = 'numeric';
      verse.textContent = occ.verse || '';
      tr.appendChild(verse);

      const attribution = document.createElement('td');
      const info = ATTRIBUTION[occ.attribution] ||
                   { label: occ.attribution || '', cls: 'badge-unattributed' };
      const badge = document.createElement('span');
      badge.className = 'badge ' + info.cls;
      badge.textContent = info.label;
      attribution.appendChild(badge);
      tr.appendChild(attribution);

      const namer = document.createElement('td');
      namer.textContent = occ.namer || '—';
      tr.appendChild(namer);

      const naming = document.createElement('td');
      naming.className = 'naming';
      naming.textContent = occ.naming || '';
      tr.appendChild(naming);

      if (scope === 'both') {
        const category = document.createElement('td');
        category.textContent = CATEGORY[occ.category] || occ.category || '';
        tr.appendChild(category);
      }

      tb.appendChild(tr);
    });

    table.appendChild(tb);
    return table;
  }

  // ─── Figure view of one lemma ───────────────────────────────────
  function renderFigures() {
    const lemma = currentLemma();
    const scope = payload.scope;
    const cols  = figureColumns(scope);

    summaryEl.hidden = false;
    summaryEl.innerHTML = '';
    summaryEl.appendChild(document.createTextNode('The lemma '));
    const strong = document.createElement('strong');
    strong.textContent = lemma.lemma;
    summaryEl.appendChild(strong);
    summaryEl.appendChild(document.createTextNode(
      ' names ' + lemma.figure_count + (lemma.figure_count === 1 ? ' figure' : ' figures') +
      ' in ' + lemma.total_mentions + (lemma.total_mentions === 1 ? ' mention' : ' mentions') +
      ' — searched in the ' + (SCOPE_LABELS[scope] || scope) + ' of the ' + payload.book + '.'
    ));

    hintEl.hidden = false;
    hintEl.textContent = 'Click a figure to show its individual mentions.';
    bulkEl.hidden = false;

    buildJsonHead(cols, true);

    const data = sortJsonRows(filterByFigure(lemma.figures), cols);
    tbody.innerHTML = '';
    const frag = document.createDocumentFragment();

    data.forEach(function (figure, index) {
      const isOpen = expanded.has(figure.figure);

      const tr = document.createElement('tr');
      tr.className = 'figure-row' + (index % 2 ? ' alt' : '') + (isOpen ? ' open' : '');

      const twisty = document.createElement('td');
      twisty.className = 'twisty';
      twisty.textContent = isOpen ? '▼' : '▶';
      tr.appendChild(twisty);

      cols.forEach(function (col) {
        const td = document.createElement('td');
        td.textContent = figure[col.key] !== undefined ? figure[col.key] : '';
        if (col.numeric) td.classList.add('numeric');
        if (col.key === 'figure') td.classList.add('figure-name');
        tr.appendChild(td);
      });

      tr.addEventListener('click', function () {
        if (expanded.has(figure.figure)) { expanded.delete(figure.figure); }
        else { expanded.add(figure.figure); }
        renderJson();
      });

      frag.appendChild(tr);

      if (isOpen) {
        const detailRow = document.createElement('tr');
        detailRow.className = 'detail-row';
        const cell = document.createElement('td');
        cell.colSpan = cols.length + 1;
        cell.appendChild(buildDetailTable(figure, scope));
        detailRow.appendChild(cell);
        frag.appendChild(detailRow);
      }
    });

    tbody.appendChild(frag);

    const total = lemma.figures.length;
    caption.textContent = (data.length === total)
      ? total + (total === 1 ? ' figure' : ' figures')
      : data.length + ' of ' + total + ' figures';
  }

  // ─── Comparison of all lemmas ───────────────────────────────────
  function renderComparison() {
    const cols = comparisonColumns();

    summaryEl.hidden = false;
    summaryEl.textContent =
      'Mentions per figure for ' + payload.lemmas.length + ' lemmas in the ' + payload.book +
      ', searched in the ' + (SCOPE_LABELS[payload.scope] || payload.scope) +
      '. The first row counts the whole work, independent of the individual figures.';

    hintEl.hidden = true;
    bulkEl.hidden = true;

    buildJsonHead(cols, false);

    // One row per figure, plus the totals of the whole work
    const byFigure = {};
    payload.lemmas.forEach(function (lemma, i) {
      lemma.figures.forEach(function (figure) {
        const row = byFigure[figure.figure] ||
                    (byFigure[figure.figure] = { figure: figure.figure, total: 0 });
        row['l' + i] = figure.mentions;
        row.total += figure.mentions;
      });
    });

    const rows = Object.keys(byFigure).map(function (name) {
      const row = byFigure[name];
      payload.lemmas.forEach(function (lemma, i) {
        if (row['l' + i] === undefined) row['l' + i] = 0;
      });
      return row;
    });

    tbody.innerHTML = '';
    const frag = document.createDocumentFragment();

    const totalsRow = document.createElement('tr');
    totalsRow.className = 'figure-row';
    const totalsCell = document.createElement('td');
    totalsCell.className = 'figure-name';
    totalsCell.textContent = 'All figures';
    totalsRow.appendChild(totalsCell);

    let grandTotal = 0;
    payload.lemmas.forEach(function (lemma) {
      const td = document.createElement('td');
      td.className = 'numeric';
      td.textContent = lemma.total_mentions;
      grandTotal += lemma.total_mentions;
      totalsRow.appendChild(td);
    });
    const grandCell = document.createElement('td');
    grandCell.className = 'numeric';
    grandCell.textContent = grandTotal;
    totalsRow.appendChild(grandCell);
    totalsRow.style.fontWeight = '500';
    frag.appendChild(totalsRow);

    sortJsonRows(filterByFigure(rows), cols).forEach(function (row, index) {
      const tr = document.createElement('tr');
      tr.className = 'figure-row' + (index % 2 ? '' : ' alt');
      tr.style.cursor = 'default';
      cols.forEach(function (col) {
        const td = document.createElement('td');
        td.textContent = row[col.key] !== undefined ? row[col.key] : '';
        if (col.numeric) td.classList.add('numeric');
        if (col.key === 'figure') td.classList.add('figure-name');
        tr.appendChild(td);
      });
      frag.appendChild(tr);
    });

    tbody.appendChild(frag);
    caption.textContent = rows.length + (rows.length === 1 ? ' figure' : ' figures');
  }

  function renderJson() {
    renderTabs();
    if (inComparison()) { renderComparison(); } else { renderFigures(); }
  }

  function renderTabs() {
    if (!hasComparison) { tabsEl.hidden = true; return; }

    tabsEl.hidden = false;
    tabsEl.innerHTML = '';

    const labels = ['Comparison'].concat(payload.lemmas.map(function (l) { return l.lemma; }));
    labels.forEach(function (label, index) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'tab' + (index === activeTab ? ' active' : '');

      if (index === 0) {
        button.textContent = label;
      } else {
        const em = document.createElement('em');
        em.textContent = label;
        button.appendChild(em);
      }

      button.addEventListener('click', function () {
        activeTab = index;
        expanded.clear();
        jsonSortKey = (index === 0) ? 'total' : 'mentions';
        jsonSortDir = -1;
        renderJson();
      });

      tabsEl.appendChild(button);
    });
  }

  // ─── JSON laden ─────────────────────────────────────────────────
  function loadJson(path) {
    fetch(path)
      .then(function (response) {
        if (!response.ok) throw new Error('HTTP ' + response.status);
        return response.json();
      })
      .then(function (data) {
        if (!data || !Array.isArray(data.lemmas) || !data.lemmas.length) {
          stateEl.innerHTML = 'No lemma data found in <code>' + path + '</code>.';
          stateEl.classList.add('error');
          return;
        }

        payload = data;
        hasComparison = data.lemmas.length > 1;
        activeTab = 0;
        jsonSortKey = hasComparison ? 'total' : 'mentions';

        if (!title) {
          const names = data.lemmas.map(function (l) { return l.lemma; });
          titleEl.innerHTML = 'Figures named by <em>' + names.join('</em>, <em>') + '</em>';
          document.title = 'Lemma search · Naming Poetics of Middle High German Epic';
        }
        if (!desc) {
          sub.textContent = data.book + ' · ' + (SCOPE_LABELS[data.scope] || data.scope);
        }

        searchHandler = renderJson;
        stateEl.hidden = true;
        tableEl.hidden = false;
        renderJson();
      })
      .catch(function (err) {
        stateEl.classList.add('error');
        stateEl.innerHTML =
          'The file <code>' + path + '</code> could not be loaded.<br><br>' +
          'Most common reason: The page was opened directly via <code>file://</code>. ' +
          'For security reasons, JSON files can only be loaded if the page is served via a ' +
          'server (e.g., locally <code>python3 -m http.server</code>, ' +
          'or via your hosting).<br><br><em>' + (err && err.message ? err.message : '') + '</em>';
      });
  }

  document.getElementById('expand-all').addEventListener('click', function () {
    if (!payload || inComparison()) return;
    currentLemma().figures.forEach(function (f) { expanded.add(f.figure); });
    renderJson();
  });
  document.getElementById('collapse-all').addEventListener('click', function () {
    expanded.clear();
    renderJson();
  });

  // ─── Suche live ─────────────────────────────────────────────────
  search.addEventListener('input', function () { searchHandler(); });

  // ─── Quelle waehlen ─────────────────────────────────────────────
  if (jsonPath) { loadJson(jsonPath); } else { loadCsv(csvPath); }
})();
</script>
</body>
</html>
